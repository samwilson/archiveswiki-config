name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_DATABASE: my_wiki
          MYSQL_ROOT_PASSWORD: testpwd
        ports:
          - '3306:3306'
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4

    - name: Install MediaWiki
      run: |
        git clone https://gerrit.wikimedia.org/r/mediawiki/core.git --recursive --shallow-submodules --depth=1 --branch=REL1_46 tmp_wiki
        cd tmp_wiki
        ln -s ../mediawiki/composer.local.json composer.local.json
        composer update
        ./maintenance/run install --dbpass=testpwd --dbuser=root --dbserver=127.0.0.1 --skins=Vector --dbprefix=ci --pass=admin123admin TestWiki Admin
        echo 'require_once "../mediawiki/LocalSettings-tests.php";' >> LocalSettings.php
        ./maintenance/run update --quick

    - name: Run PHPUnit tests
      continue-on-error: true
      run: |
        cd tmp_wiki
        composer phpunit -- --stop-on-failure --stop-on-error

    - name: Normalize composer.local.json
      run: |
        cd mediawiki
        composer install
        composer test
